services:
  postgres:
    image: postgres:16-alpine
    container_name: subseopro-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: subseopro
      POSTGRES_USER: subseopro
      POSTGRES_PASSWORD: subseopro_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subseopro -d subseopro"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
